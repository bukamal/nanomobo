[project]
name = "nanomobo"
version = "0.1.0"
description = "NanoMobo — Android mobile-device servicing and flashing toolkit"
requires-python = ">=3.10"
dependencies = [
    "flet==0.85.2",
]

[project.optional-dependencies]
dev = [
    "flet-cli==0.85.2",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "F",
    "E9",
    "B",
    "I",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "B008",  # calls in default args are intentional with Flet controls
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/integration", "tests/contract"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "unit: fast pure-python tests (no device, no UI runtime)",
    "integration: tests that build a real Flet control tree",
    "contract: configuration/layering contracts that guard the Android build",
]

[tool.coverage.run]
source = ["nanomobo", "main"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build/", "dist/"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Flet packaging
# ---------------------------------------------------------------------------
[tool.flet]
org = "com.nano"
product = "NanoMobo"
company = "Nano"
copyright = "Copyright (C) 2026"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.splash]
color = "#0B1120"
dark_color = "#070C17"
android = true

[tool.flet.android]
adaptive_icon_background = "#0B1120"
# pyjnius is the JNI bridge that lets Python drive android.hardware.usb.* for
# flashing, IMEI and EFS work. Android-only: it is deliberately NOT in
# [project.dependencies], so desktop runs stay installable without a JVM.
# Guarded by tests/contract/test_packaging_contract.py.
dependencies = [
    "pyjnius",
]

# USB host is a hard requirement for this app — without it there is nothing to
# talk to. Declaring it as a required feature also keeps the app out of
# Play Store search results on devices that cannot host USB at all.
[tool.flet.android.feature]
"android.hardware.usb.host" = true

[tool.flet.android.manifest_application]
# Repair/flashing tool: never let the OS back up or restore app state across
# devices (auth keys, session logs, firmware cache must stay on-device).
allowBackup = "false"
